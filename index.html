<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSW2 Business Career Reviewer</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.header{
  background:white;
  border-radius:22px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.header h1{
  margin:0 0 8px;
  font-size:28px;
}

.header p{
  margin:0;
  color:#6b7280;
}

.card{
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.progress{
  color:#6b7280;
  margin-bottom:15px;
  font-weight:bold;
}

.question{
  font-size:20px;
  line-height:1.8;
  margin-bottom:20px;
}

.choice{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  margin:10px 0;
  cursor:pointer;
  background:#fff;
  font-size:17px;
}

.choice:hover{
  background:#f3f4f6;
}

.choice.selected{
  border:2px solid #111;
  background:#f3f4f6;
}

.answer{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:#eef2ff;
  line-height:1.8;
}

.answer strong{
  font-size:18px;
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:22px;
}

button{
  border:0;
  border-radius:13px;
  padding:14px 22px;
  font-size:16px;
  cursor:pointer;
}

.prev{
  background:#e5e7eb;
}

.next{
  background:#111827;
  color:white;
}

.show{
  width:100%;
  margin-top:15px;
  background:#2563eb;
  color:white;
}

.tagalog{
  margin-top:10px;
  padding:12px;
  background:#f9fafb;
  border-radius:10px;
}

ruby{
  ruby-position:over;
}

@media(max-width:600px){
  .container{padding:12px}
  .header h1{font-size:24px}
  .question{font-size:18px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>SSW2 Business Career Reviewer</h1>
<p>Japanese + Furigana + Tagalog Explanation</p>
</div>

<div class="card">

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<div id="choices"></div>

<button class="show" onclick="showAnswer()">
答え・Tagalog Explanation
</button>

<div class="answer" id="answer"></div>

<div class="buttons">
<button class="prev" onclick="previousQuestion()">← Previous</button>
<button class="next" onclick="nextQuestion()">Next →</button>
</div>

</div>
</div>

<script>

const questions = [

{
q:`<ruby>機械<rt>きかい</rt></ruby>・<ruby>装置<rt>そうち</rt></ruby>以外<rt>いがい</rt>で<ruby>設備管理<rt>せつびかんり</rt></ruby>の<ruby>対象<rt>たいしょう</rt></ruby>となる<ruby>設備<rt>せつび</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>適切<rt>てきせつ</rt></ruby>なものは、<ruby>次<rt>つぎ</rt></ruby>のうちどれか。`,
choices:[
`ア．<ruby>工具<rt>こうぐ</rt></ruby>`,
`イ．<ruby>原材料<rt>げんざいりょう</rt></ruby>`,
`ウ．<ruby>知的財産<rt>ちてきざいさん</rt></ruby>`,
`エ．<ruby>有価証券<rt>ゆうかしょうけん</rt></ruby>`
],
answer:"ア．工具（こうぐ）",
ex:`Ang <b>工具</b> ay maaaring maging bahagi ng equipment/facility management. Ang raw materials, intellectual property at securities ay hindi equipment.`
},

{
q:`ISO9000シリーズに<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは、<ruby>次<rt>つぎ</rt></ruby>のうちどれか。`,
choices:[
`ア．ISO9001は、<ruby>品質<rt>ひんしつ</rt></ruby>マネジメントシステムの<ruby>要求事項<rt>ようきゅうじこう</rt></ruby>を<ruby>表<rt>あらわ</rt></ruby>している。`,
`イ．ISO9000シリーズは、<ruby>品質<rt>ひんしつ</rt></ruby>マネジメントシステムの<ruby>国際規格<rt>こくさいきかく</rt></ruby>である。`,
`ウ．JISは、ISO9000シリーズとは<ruby>独立<rt>どくりつ</rt></ruby>した<ruby>規格<rt>きかく</rt></ruby>である。`,
`エ．品質マネジメントシステムは、<ruby>経営管理<rt>けいえいかんり</rt></ruby>の<ruby>一環<rt>いっかん</rt></ruby>として<ruby>取<rt>と</rt></ruby>り<ruby>入<rt>い</rt></ruby>れられている。`
],
answer:"ウ",
ex:`JISはISOと完全に独立した規格ではありません。ISO規格をJISとして採用しているものもあります。`
},

{
q:`<ruby>動作経済<rt>どうさけいざい</rt></ruby>の<ruby>原則<rt>げんそく</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．工具や材料は、同じ作業を繰り返す場合でも、作業実績に合わせて常に置く位置を変更すべきである。`,
`イ．材料を使用点の近くに運ぶには、重力利用の装置を使用すべきである。`,
`ウ．できるだけ楽で自然なリズムで仕事ができるように仕事をアレンジする。`,
`エ．両手の動作は同時に始め、また、同時に終了すべきである。`
],
answer:"ア",
ex:`動作経済では、工具や材料は<b>一定の使いやすい位置</b>に置くのが基本です。「常に位置を変更する」は逆なので不適切です。`
},

{
q:`<ruby>倉庫<rt>そうこ</rt></ruby>の<ruby>機能別分類<rt>きのうべつぶんるい</rt></ruby>として<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．<ruby>流通加工型<rt>りゅうつうかこうがた</rt></ruby>センター`,
`イ．<ruby>自動倉庫型<rt>じどうそうこがた</rt></ruby>センター`,
`ウ．<ruby>通過型<rt>つうかがた</rt></ruby>センター`,
`エ．<ruby>在庫型<rt>ざいこがた</rt></ruby>センター`
],
answer:"イ",
ex:`自動倉庫型は「自動化・設備方式」による分類で、機能別分類とは異なります。`
},

{
q:`<ruby>生産計画<rt>せいさんけいかく</rt></ruby>・<ruby>統制<rt>とうせい</rt></ruby>での「<ruby>目で見る管理<rt>めでみるかんり</rt></ruby>」として<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．製造三角図や流動数曲線などを利用して計画と実績の進捗を管理する。`,
`イ．管理盤などで生産に従事する複数の担当者の動きを同時に管理する。`,
`ウ．目視検査でガラス瓶のカケを発見しやすくするように背後の光量を管理する。`,
`エ．電光掲示板などで目標生産量と生産実績などを確認する。`
],
answer:"ウ",
ex:`ウは目視検査の照明条件に関する内容で、生産計画・統制の「見える化」とは異なります。`
},

{
q:`<ruby>物流<rt>ぶつりゅう</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．物流の構成要素には、輸送、保管、荷役、包装、流通加工、情報などがある。`,
`イ．物流は現象的にはモノの流れであり、経済的性格の商流とは全く関係がない。`,
`ウ．物流とは物的流通のことであり、経済において取引流通や資金の流れと対をなす。`,
`エ．物流は調達物流、生産物流、販売物流、回収物流、消費者物流の5つに大別される。`
],
answer:"イ",
ex:`物流と商流は別の概念ですが、<b>全く関係がない</b>わけではありません。商品・取引の流れと物の流れは密接に関係します。`
},

{
q:`<ruby>設備保全<rt>せつびほぜん</rt></ruby>の<ruby>活動<rt>かつどう</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．様々な故障に対応するために点検周期はランダムにする。`,
`イ．点検項目を明確にするために点検表を作成する。`,
`ウ．設備を扱う作業者に5Sを徹底させる。`,
`エ．故障を予防するために事前に保守を行う。`
],
answer:"ア",
ex:`点検周期は計画的・適切に設定します。「ランダムにする」は不適切です。`
},

{
q:`<ruby>原価<rt>げんか</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．成行原価とは、現行の技術を基に見積もった原価である。`,
`イ．理没原価とは、代替案の選択において棄却された代替案を選択して生じると考えられる最大の利益である。`,
`ウ．標準原価とは、標準の能率や生産性、標準の原価率を適用する原価である。`,
`エ．部分原価とは、計算目的によって特定の原価要素だけを集計した原価である。`
],
answer:"イ",
ex:`イの説明は一般的には「機会原価（opportunity cost）」の考え方に近い説明です。用語と説明の対応が不適切です。`
},

{
q:`<ruby>再生<rt>さいせい</rt></ruby>して<ruby>動作研究<rt>どうさけんきゅう</rt></ruby>を<ruby>行<rt>おこな</rt></ruby>うとき、動作研究で検討できない項目は？`,
choices:[
`ア．サーブリックごとの発生頻度`,
`イ．作業に必要な動作要素と所要時間`,
`ウ．組立作業の作業者別稼働率`,
`エ．無駄な動作の少ない組立作業における動作順序`
],
answer:"ウ",
ex:`動作研究は「動作そのもの」を分析する方法です。作業者別の稼働率は動作研究の中心的な対象ではありません。`
},

{
q:`<ruby>作業管理<rt>さぎょうかんり</rt></ruby>に<ruby>含<rt>ふく</rt></ruby>まれている<ruby>活動<rt>かつどう</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．作業の改善`,
`イ．不適合品の改善`,
`ウ．標準作業と標準時間の設定`,
`エ．標準の維持`
],
answer:"イ",
ex:`不適合品の改善は品質管理・品質改善の領域です。作業管理では作業方法、標準時間、標準作業の維持・改善などを扱います。`
},

{
q:`<ruby>納期遅延<rt>のうきちえん</rt></ruby>を<ruby>防止<rt>ぼうし</rt></ruby>するためのポイントとして<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．生産計画では、飛び込み注文を想定せず、厳密に計画することが重要である。`,
`イ．製造部門では進捗管理及び現品管理が重要である。`,
`ウ．資材部門では調達品が納期どおり納入されるよう管理する。`,
`エ．設計部門では設計作業の進捗管理が重要である。`
],
answer:"ア",
ex:`飛び込み注文などの変動を考慮する必要があるため、「想定せず厳密に計画する」は不適切です。`
},

{
q:`<ruby>資材管理<rt>しざいかんり</rt></ruby>の<ruby>意義<rt>いぎ</rt></ruby>及び<ruby>構成<rt>こうせい</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>適切<rt>てきせつ</rt></ruby>なものは？`,
choices:[
`ア．生産管理の面では必要ない。`,
`イ．分類する仕方によらず管理は変わらない。`,
`ウ．資材業務は、要求、調達、受入・検収、保管という順序で実施される。`,
`エ．購買、外注、マーケティング…`
],
answer:"ウ",
ex:`資材管理では、必要な資材を要求し、調達し、受入・検収し、保管する流れが基本です。`
},

{
q:`<ruby>製造業<rt>せいぞうぎょう</rt></ruby>における<ruby>原価低減<rt>げんかていげん</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>適切<rt>てきせつ</rt></ruby>なものは？`,
choices:[
`ア．直接材料費の低減対策として、VEによる材質の見直しが有効である。`,
`イ．直接材料費の低減対策として、付加価値を生まない時間の短縮が有効である。`,
`ウ．直接労務費の低減対策として、より安価な代替材料を検討する。`,
`エ．直接労務費の低減対策として、材料調達方法を見直す。`
],
answer:"ア",
ex:`VE（Value Engineering）によって材料・材質を見直すことは、直接材料費の低減につながります。`
},

{
q:`<ruby>集中購買方式<rt>しゅうちゅうこうばいほうしき</rt></ruby>と<ruby>分散購買方式<rt>ぶんさんこうばいほうしき</rt></ruby>の<ruby>利点<rt>りてん</rt></ruby>として<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．集中購買では集中発注により購買価格を引き下げられる。`,
`イ．集中購買では購買事務手続きを統一できる。`,
`ウ．分散購買では資材の標準化が容易となる。`,
`エ．分散購買では各工場が立地する地域企業に貢献できる。`
],
answer:"ウ",
ex:`資材の標準化は、一般に集中購買のほうが進めやすいです。分散購買の特徴とはいえません。`
},

{
q:`下図のa〜dに入る用語の組合せとして適切なものは？`,
choices:[
`ア．a：原価低減　b：原価改善　c：原価企画　d：ABC`,
`イ．a：原価低減　b：原価企画　c：原価改善　d：標準原価計算`,
`ウ．a：原価改善　b：原価低減　c：原価企画　d：ABC`,
`エ．a：原価改善　b：原価低減　c：原価企画　d：標準原価計算`
],
answer:"図が元データにないため要確認",
ex:`この問題は「下図」が必要です。元のベトナム語版の図を送ってくれれば、正確な答えを入れられます。`
},

{
q:`納期遅延防止を目的とした「目で見る管理」として不適切なものは？`,
choices:[
`ア．電光掲示板等により、現在の目標生産量や生産実績量を表示する。`,
`イ．ジョブカードを使い、計画の進捗状況や変更を現場監督者の机の上で見られるようにする。`,
`ウ．材料・部品について、何が、どこに、どれだけあるか識別できるよう表示する。`,
`エ．材料・部品の保管場所、パレット置場、運搬通路等を表示する。`
],
answer:"イ",
ex:`「目で見る管理」は現場の作業者が<b>その場で瞬時に分かる</b>ことが重要です。監督者の机の上だけで見る方法は不適切です。`
},

{
q:`<ruby>原価<rt>げんか</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>記述<rt>きじゅつ</rt></ruby>として<ruby>最<rt>もっと</rt></ruby>も<ruby>不適切<rt>ふてきせつ</rt></ruby>なものは？`,
choices:[
`ア．実際原価は、実際価格又は予定価格と予定消費量の積である。`,
`イ．標準原価は、標準の操業度・方法・能率・原価率を適用して算出する。`,
`ウ．目標原価は、製品設計段階でのコストダウン目標として設定する。`,
`エ．成行原価は、製品設計の初期段階において算出する。`
],
answer:"ア",
ex:`実際原価は基本的に「実際価格 × 実際消費量」です。「予定消費量」とする点が不適切です。`
},

{
q:`<ruby>時間研究<rt>じかんけんきゅう</rt></ruby>に関する記述として最も不適切なものは？`,
choices:[
`ア．複数の作業者ではペースが異なるため、標準的な正味時間を定めることはできない。`,
`イ．動画を利用した時間研究では、フレーム数を換算して時間を求める。`,
`ウ．予定外作業は例外作業として欄外に記入し、要素作業の観測データには含めない。`,
`エ．ストップウォッチ法では継続法と早戻し法が代表的である。`
],
answer:"ア",
ex:`作業者によってペースが違っても、レイティングなどを利用して標準時間を設定できます。「できない」は不適切です。`
},

{
q:`<ruby>検査<rt>けんさ</rt></ruby>の<ruby>考<rt>かんが</rt></ruby>え<ruby>方<rt>かた</rt></ruby>に関する記述として最も不適切なものは？`,
choices:[
`ア．外注からの受入検査は、全数検査を行うことが原則である。`,
`イ．抜取検査は、製品価格が安く、ある程度の不適合品の混入が許される場合に適用される。`,
`ウ．合格にすべきロットを不合格にしてしまう誤りは、生産者危険である。`,
`エ．全数検査は、必ずしも全製品が適合品であることを保証できない。`
],
answer:"ア",
ex:`受入検査が必ず全数検査になるわけではありません。品質・コスト・リスクなどに応じて抜取検査も利用されます。`
},

{
q:`PDCAサイクルの各項目とISO14001:2015の要求事項の対応として最も不適切なものは？`,
choices:[
`ア．Plan － 計画`,
`イ．Do － 支援及び運用`,
`ウ．Act － 実施`,
`エ．Check － パフォーマンス評価`
],
answer:"ウ",
ex:`PDCAでは、<b>Plan＝計画、Do＝実施、Check＝評価、Act＝改善</b>です。Actを「実施」とするのは不適切です。`
},

{
q:`<ruby>設備<rt>せつび</rt></ruby>の<ruby>劣化<rt>れっか</rt></ruby>により生じる<ruby>損失<rt>そんしつ</rt></ruby>として最も不適切なものは？`,
choices:[
`ア．安全性が低下する。`,
`イ．製造コストが低下する。`,
`ウ．企業の信頼が低下する。`,
`エ．生産量が低下する。`
],
answer:"イ",
ex:`設備が劣化すると通常はコストが<b>上昇</b>する方向です。「製造コストが低下する」は不適切です。`
},

{
q:`生産計画・統制における目で見る管理に関する記述として最も適切なものは？`,
choices:[
`ア．流動数曲線の2つの曲線の差は在庫量を表す。`,
`イ．製造三角図では横軸に時間、縦軸に累積在庫量をとる。`,
`ウ．ガントチャートは工数計画や余力管理などのために用いられる図表である。`,
`エ．管理盤は作業予定・現品管理・統制などを表示する盤である。`
],
answer:"ア",
ex:`流動数曲線では、流入と流出の累積量の差から在庫量を把握できます。`
},

{
q:`<ruby>棚卸<rt>たなおろし</rt></ruby>に関する記述として最も不適切なものは？`,
choices:[

let current = 0;
let selected = null;

function loadQuestion(){

  const q = questions[current];

  document.getElementById("progress").innerText =
    `Question ${current+1} / ${questions.length}`;

  document.getElementById("question").innerHTML = q.q;

  const choices = document.getElementById("choices");
  choices.innerHTML = "";

  q.choices.forEach((choice,index)=>{

    const div = document.createElement("div");

    div.className = "choice";

    div.innerHTML = choice;

    div.onclick = function(){

      document.querySelectorAll(".choice")
        .forEach(x=>x.classList.remove("selected"));

      div.classList.add("selected");

      selected = index;
    };

    choices.appendChild(div);
  });

  document.getElementById("answer").style.display="none";
  document.getElementById("answer").innerHTML="";
  selected=null;
}

function showAnswer(){

  const q = questions[current];

  const answer = document.getElementById("answer");

  answer.style.display="block";

  answer.innerHTML =
  `<strong>答え：${q.answer}</strong>
   <div class="tagalog">
   🇵🇭 <b>Tagalog:</b><br>
   ${q.ex}
   </div>`;
}

function nextQuestion(){

  if(current < questions.length-1){
    current++;
    loadQuestion();
    window.scrollTo(0,0);
  }
}

function previousQuestion(){

  if(current > 0){
    current--;
    loadQuestion();
    window.scrollTo(0,0);
  }
}

loadQuestion();

</script>
