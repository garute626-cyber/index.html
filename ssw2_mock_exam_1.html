{q:"動作（どうさ）経済（けいざい）の原則（げんそく）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．工具（こうぐ）や材料（ざいりょう）は、同じ（おなじ）作業（さぎょう）を繰り返し（くりかえし）行う（おこなう）場合（ばあい）でも、作業（さぎょう）実績（じっせき）に合わせ（あわせ）て常に（つねに）置く（おく）位置（いち）を変更（へんこう）すべきである。","イ．材料（ざいりょう）を使用（しよう）点（てん）の近く（ちかく）に運ぶ（はこぶ）には、重力（じゅうりょく）利用（りよう）の装置（そうち）を使用（しよう）すべきである。","ウ．できるだけ楽（らく）で自然（しぜん）なリズムで仕事（しごと）ができるように仕事（しごと）をアレンジする。","エ．両手（りょうて）の動作（どうさ）は同時（どうじ）に始め（はじめ）、また、同時（どうじ）に終了（しゅうりょう）すべきである。"],a:0,e:"繰り返し作業では工具・材料の位置を安定させ、取りやすくすることが原則です。常に位置を変更するのは不適切です。",k:"動作経済＝無駄な動作を減らす"},

c:["ア．流通（りゅうつう）加工（かこう）型（がた）センター","イ．自動（じどう）倉庫（そうこ）型（がた）センター","ウ．通過（つうか）型（がた）センター","エ．在庫（ざいこ）型（がた）センター"],a:1,e:"機能別分類としては流通加工型・通過型・在庫型などがあり、自動倉庫型は機能ではなく設備・方式の分類です。",k:"倉庫の機能＝流通加工・通過・在庫"},
{q:"問題36 生産（せいさん）計画（けいかく）・統制（とうせい）での「目（め）で見る（みる）管理（かんり）」として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．製造（せいぞう）三角（さんかく）図（ず）や流動（りゅうどう）数（すう）曲線（きょくせん）などを利用（りよう）して計画（けいかく）と実績（じっせき）の進捗（しんちょく）を管理（かんり）する。","イ．管理（かんり）盤（ばん）などで生産（せいさん）に従事（じゅうじ）する複数（ふくすう）の担当（たんとう）者（しゃ）の動き（うごき）を同時（どうじ）に管理（かんり）する。","ウ．目視（もくし）検査（けんさ）において、ガラス瓶（がらすびん）のカケを発見（はっけん）しやすくするように背後（はいご）の光量（ひかりょう）を管理（かんり）する。","エ．電光（でんこう）掲示板（けいじばん）などで現時点（げんじてん）での目標（もくひょう）生産（せいさん）量（りょう）と生産（せいさん）実績（じっせき）などを確認（かくにん）する。"],a:2,e:"ウは目視検査の照明条件に関する内容で、生産計画・統制の目で見る管理とは直接関係しません。",k:"目で見る管理＝進捗・実績を見える化"},
{q:"問題23 物流（ぶつりゅう）に関する（かんする）記述（きじゅつ）として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．物流（ぶつりゅう）の構成（こうせい）要素（ようそ）には、輸送（ゆそう）、保管（ほかん）、荷役（にやく）、包装（ほうそう）、流通（りゅうつう）加工（かこう）、情報（じょうほう）などがある。","イ．物流（ぶつりゅう）は現象（げんしょう）的（てき）にはモノの流れ（ながれ）であり、経済（けいざい）的（てき）性格（せいかく）の商（しょう）流（りゅう）とは全く（まったく）関係（かんけい）がない。","ウ．物流（ぶつりゅう）とは物的（ぶってき）流通（りゅうつう）のことであり、経済（けいざい）においては取引（とりひき）流通（りゅうつう）や資金（しきん）の流れ（ながれ）と対（たい）をなすものである。","エ．物流（ぶつりゅう）は目的（もくてき）別（べつ）に、調達（ちょうたつ）物流（ぶつりゅう）、生産（せいさん）物流（ぶつりゅう）、販売（はんばい）物流（ぶつりゅう）、回収（かいしゅう）物流（ぶつりゅう）、消費（しょうひ）者（しゃ）物流（ぶつりゅう）の5つに大別（たいべつ）される。"],a:1,e:"物流と商流は別の概念ですが、全く関係がないわけではありません。",k:"物流＝物の流れ; 商流＝取引の流れ"},

{q:"問題31 原価（げんか）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．成行（しげゆき）原価（げんか）とは、現行（げんこう）の技術（ぎじゅつ）を基（もと）に見積もっ（みつもっ）た原価（げんか）である。","イ．理（り）没（ぼつ）原価（げんか）とは、代替（だいたい）案（あん）の選択（せんたく）において棄却（ききゃく）された代替（だいたい）案（あん）を、選択（せんたく）して生じる（しょうじる）と考え（かんがえ）られる最大（さいだい）の利益（りえき）である。","ウ．標準（ひょうじゅん）原価（げんか）とは、標準（ひょうじゅん）の能率（のうりつ）や生産（せいさん）性（せい）、標準（ひょうじゅん）の原価（げんか）率（りつ）を適用（てきよう）する原価（げんか）である。","エ．部分（ぶぶん）原価（げんか）とは、計算（けいさん）目的（もくてき）によって特定（とくてい）の原価（げんか）要素（ようそ）だけを集計（しゅうけい）した原価（げんか）である。"],a:1,e:"理没原価は、選択しなかった代替案から得られたはずの最大の利益、つまり機会原価に近い考え方です。提示文の定義は不適切です。",k:"成行原価＝現行技術; 標準原価＝標準条件"},
{q:"問題4 …再生（さいせい）して動作（どうさ）研究（けんきゅう）を行う（おこなう）とき、動作（どうさ）研究（けんきゅう）で検討（けんとう）できない項目（こうもく）は、次（つぎ）のうちどれか。",

c:["ア．生産（せいさん）計画（けいかく）を立案（りつあん）する際（さい）には、あらかじめ飛び込み（とびこみ）注文（ちゅうもん）が入る（はいる）ことを想定（そうてい）せず、厳密（げんみつ）に計画（けいかく）することが重要（じゅうよう）である。","イ．製造（せいぞう）部門（ぶもん）では、生産（せいさん）統制（とうせい）における進捗（しんちょく）管理（かんり）及び（および）現品（げんぴん）管理（かんり）が重要（じゅうよう）である。","ウ．資材（しざい）部門（ぶもん）では、調達（ちょうたつ）品（ひん）が納期（のうき）どおりに納入（のうにゅう）されるように管理（かんり）することが重要（じゅうよう）である。","エ．設計（せっけい）部門（ぶもん）では、設計（せっけい）作業（さぎょう）の進捗（しんちょく）管理（かんり）が重要（じゅうよう）である"],a:0,e:"納期遅延防止では、飛び込み注文などの変動も考慮して余力を持たせることが重要です。",k:"納期＝進捗管理・現品管理・調達管理"},
{q:"問題20 資材（しざい）管理（かんり）の意義（いぎ）及び（および）構成（こうせい）に関する（かんする）記述（きじゅつ）として最も（もっとも）適切（てきせつ）なものは、どれか。",

{q:"問題33 製造（せいぞう）業（ぎょう）における原価（げんか）低減（ていげん）に関する（かんする）記述（きじゅつ）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．直接（ちょくせつ）材料（ざいりょう）費（ひ）の原価（げんか）低減（ていげん）の対策（たいさく）として、VEによる材質（ざいしつ）の見直し（みなおし）が有効（ゆうこう）である。","イ．直接（ちょくせつ）材料（ざいりょう）費（ひ）の原価（げんか）低減（ていげん）の対策（たいさく）として、付加（ふか）価値（かち）を生ま（うま）ない時間（じかん）の短縮（たんしゅく）が有効（ゆうこう）である。","ウ．直接（ちょくせつ）労務（ろうむ）費（ひ）の原価（げんか）低減（ていげん）の対策（たいさく）として、より安価（あんか）な代替（だいたい）材料（ざいりょう）の検討（けんとう）をすべきである。","エ．直接（ちょくせつ）労務（ろうむ）費（ひ）の原価（げんか）低減（ていげん）の対策（たいさく）として、材料（ざいりょう）調達（ちょうたつ）方法（ほうほう）の見直し（みなおし）を検討（けんとう）すべきである。"],a:0,e:"直接材料費を下げる方法として、VEによる材質の見直しは有効です。",k:"VE＝価値を保ちながらコスト低減"},
{q:"問題22 集中（しゅうちゅう）購買（こうばい）方式（ほうしき）と分散（ぶんさん）購買（こうばい）方式（ほうしき）のそれぞれの利点（りてん）に関する（かんする）記述（きじゅつ）として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．集中（しゅうちゅう）購買（こうばい）方式（ほうしき）では、集中（しゅうちゅう）発注（はっちゅう）により購買（こうばい）価格（かかく）の引き下げ（ひきさげ）ができる。","イ．集中（しゅうちゅう）購買（こうばい）方式（ほうしき）では、購買（こうばい）事務（じむ）手続（てつづ）きを統一（とういつ）できる。","ウ．分散（ぶんさん）購買（こうばい）方式（ほうしき）では、資材（しざい）の標準（ひょうじゅん）化（か）が容易（ようい）となる。","エ．分散（ぶんさん）購買（こうばい）方式（ほうしき）では、各（かく）工場（こうじょう）が立地（りっち）する地域（ちいき）企業（きぎょう）に貢献（こうけん）できる。"],a:2,e:"資材の標準化は集中購買のほうが進めやすいです。分散購買は地域事情への対応などが利点です。",k:"集中購買＝価格・手続・標準化; 分散＝地域対応"},
{q:"問題30 下図（したず）のa〜dに入る（はいる）用語（ようご）の組合せ（くみあわせ）として適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．a：原価（げんか）低減（ていげん） b：原価（げんか）改善（かいぜん） c：原価（げんか）企画（きかく） d：ABC","イ．a：原価（げんか）低減（ていげん） b：原価（げんか）企画（きかく） c：原価（げんか）改善（かいぜん） d：標準（ひょうじゅん）原価（げんか）計算（けいさん）","ウ．a：原価（げんか）改善（かいぜん） b：原価（げんか）低減（ていげん） c：原価（げんか）企画（きかく） d：ABC","エ．a：原価（げんか）改善（かいぜん） b：原価（げんか）低減（ていげん） c：原価（げんか）企画（きかく） d：標準（ひょうじゅん）原価（げんか）計算（けいさん）"],a:3,e:"提示された問題文だけでは下図そのものが含まれていないため、a〜dの対応を資料から完全には検証できません。ここでは提示された選択肢に基づく回答としてエを設定しています。",k:"原価企画＝設計段階; 原価改善＝量産段階"},
{q:"問題36 納期（のうき）遅延（ちえん）防止（ぼうし）を目的（もくてき）とした「目（め）で見る（みる）管理（かんり）」に関する（かんする）記述（きじゅつ）として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．電光（でんこう）掲示板（けいじばん）等（とう）により、現在（げんざい）の目標（もくひょう）生産（せいさん）量（りょう）や生産（せいさん）実績（じっせき）量（りょう）を表示（ひょうじ）して、作業（さぎょう）者（しゃ）が瞬時（しゅんじ）に分かる（わかる）ようにする。","イ．作業（さぎょう）管理（かんり）盤（ばん）のジョブカードを使っ（つかっ）て、計画（けいかく）の進捗（しんちょく）状況（じょうきょう）や変更（へんこう）を、現場（げんば）監督（かんとく）者（しゃ）の机（つくえ）の上（うえ）で見（み）られるようにする。","ウ．工場（こうじょう）内（ない）に保管（ほかん）している材料（ざいりょう）・部品（ぶひん）について、何（なに）が、どこに、どれだけ置い（おいて）てあるかが識別（しきべつ）できるように表示（ひょうじ）する。","エ．スペース効率（こうりつ）や運搬（うんぱん）効率（こうりつ）を高める（たかめる）ために、材料（ざいりょう）・部品（ぶひん）の保管（ほかん）場所（ばしょ）、パレット置場（おきば）、運搬（うんぱん）通路（つうろ）等（とう）を表示（ひょうじ）する。"],a:1,e:"目で見る管理は現場の作業者がすぐ確認できることが重要です。監督者の机の上だけで見るのは不適切です。",k:"見える化＝現場で瞬時に分かる"},
{q:"問題20 原価（げんか）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．実際（じっさい）原価（げんか）は、実際（じっさい）価格（かかく）又は（または）予定（よてい）価格（かかく）と予定（よてい）消費（しょうひ）量（りょう）の積（せき）である。","イ．標準（ひょうじゅん）原価（げんか）は、標準（ひょうじゅん）の操業（そうぎょう）度（ど）において、標準（ひょうじゅん）の方法（ほうほう）に対して（たいして）、標準（ひょうじゅん）の能率（のうりつ）と標準（ひょうじゅん）の原価（げんか）率（りつ）を適用（てきよう）して算出（さんしゅつ）する。","ウ．目標（もくひょう）原価（げんか）は、製品（せいひん）設計（せっけい）段階（だんかい）でのコストダウン目標（もくひょう）として設定（せってい）する。","エ．成行（しげゆき）原価（げんか）は、製品（せいひん）設計（せっけい）の初期（しょき）段階（だんかい）において算出（さんしゅつ）する。"],a:0,e:"実際原価は実際価格と実際消費量など、実際に発生した条件に基づいて算出します。提示されたアの定義が不適切です。",k:"実際原価＝実際に発生した価格・数量"},
{q:"時間（じかん）研究（けんきゅう）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．同じ（おなじ）作業（さぎょう）に従事（じゅうじ）する複数（ふくすう）の作業（さぎょう）者（しゃ）を対象（たいしょう）にした時間（じかん）研究（けんきゅう）では、各（かく）作業（さぎょう）者（しゃ）の作業（さぎょう）ペースが異なる（ことなる）ことから、その作業（さぎょう）の標準（ひょうじゅん）的（てき）な正味（しょうみ）時間（じかん）を定める（さだめる）ことはできない。","イ．フィルム、デジタルビデオなどの記録（きろく）方式（ほうしき）に関係（かんけい）なく、動画（どうが）を利用（りよう）した時間（じかん）研究（けんきゅう）では、画面（がめん）のフレーム数（すう）を換算（かんさん）して時間（じかん）を求める（もとめる）こととなる。","ウ．繰返し（くりかえし）作業（さぎょう）を対象（たいしょう）とする時間（じかん）研究（けんきゅう）の測定（そくてい）中（ちゅう）に、予定（よてい）外（がい）の作業（さぎょう）が発生（はっせい）した場合（ばあい）、この例外（がい）作業（さぎょう）の終了（しゅうりょう）時刻（じこく）を欄外（らんがい）に記入（きにゅう）し、集計（しゅうけい）では、要素（ようそ）作業（さぎょう）の観測（かんそく）データには含め（ふくめ）ない。","エ．ストップウォッチ法（ほう）による測定（そくてい）方法（ほう）は、継続（けいぞく）法（ほう）と早（はや）戻し（もどし）法（ほう）が代表（だいひょう）的（てき）であるが、使用（しよう）するストップウォッチにラップタイムの記憶（きおく）と表示（ひょうじ）の機能（きのう）があることから、これを利用（りよう）するとよい。"],a:0,e:"複数作業者でもレイティングなどを用いることで標準的な正味時間を設定できます。「できない」とするアが不適切です。",k:"時間研究＝測定＋レイティング＋標準時間"},
{q:"問題28 検査（けんさ）の考え方（かんがえかた）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．外注（がいちゅう）からの受入（うけいれ）検査（けんさ）は、全数（ぜんすう）検査（けんさ）を行う（おこなう）ことが原則（げんそく）である。","イ．抜取（ぬきとり）検査（けんさ）は、製品（せいひん）価格（かかく）が安く（やすく）ある程度（ていど）の不適合（ふてきごう）品（ひん）の混入（こんにゅう）が許さ（ゆるさ）れる場合（ばあい）に適用（てきよう）される。","ウ．合格（ごうかく）にすべきロットを不（ふ）合格（ごうかく）にしてしまう誤り（あやまり）は、生産（せいさん）者（しゃ）危険（きけん）である。","エ．全数（ぜんすう）検査（けんさ）は、必ずしも（かならずしも）全（ぜん）製品（せいひん）が適合（てきごう）品（ひん）であることを保証（ほしょう）できない。"],a:0,e:"外注品でも、全数検査が常に原則とは限りません。品質・コスト・リスクなどに応じて抜取検査を使う場合があります。",k:"抜取検査＝ロットから一部を検査"},
{q:"PDCAサイクルの各（かく）項目（こうもく）とISO14001:2015 環境（かんきょう）マネジメントシステムの要求（ようきゅう）事項（じこう）の対応（たいおう）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．Plan － 計画（けいかく）","イ．Do － 支援（しえん）及び（および）運用（うんよう）","ウ．Act － 実施（じっし）","エ．Check － パフォーマンス評価（ひょうか）"],a:2,e:"PDCAではActは改善・是正などの段階です。「実施」はDoに対応するため、ウが不適切です。",k:"Plan＝計画; Do＝実施; Check＝評価; Act＝改善"},
{q:"問題18 設備（せつび）の劣化（れっか）により生じる（しょうじる）損失（そんしつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．安全（あんぜん）性（せい）が低下（ていか）する。","イ．製造（せいぞう）コストが低下（ていか）する。","ウ．企業（きぎょう）の信頼（しんらい）が低下（ていか）する。","エ．生産（せいさん）量（りょう）が低下（ていか）する。"],a:1,e:"設備劣化によって安全性・信頼性・生産量は低下し得ますが、製造コストが低下するとは考えません。",k:"設備劣化＝安全・信頼・生産量に悪影響"},
{q:"問題36 生産（せいさん）計画（けいかく）・統制（とうせい）における目（め）で見る（みる）管理（かんり）に関する（かんする）記述（きじゅつ）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．倉庫（そうこ）の流入（りゅうにゅう）と流出（りゅうしゅつ）を示し（しめし）た流動（りゅうどう）数（すう）曲線（きょくせん）における、２つの曲線（きょくせん）の差（さ）は、在庫（ざいこ）量（りょう）を表す（あらわす）。","イ．製造（せいぞう）三角（さんかく）図（ず）では、横（よこ）軸（じく）に時間（じかん）の目盛り（めもり）、縦（たて）軸（じく）に累積（るいせき）在庫（ざいこ）量（りょう）をとる。","ウ．ガントチャートとは、工数（こうすう）計画（けいかく）や余力（よりょく）管理（かんり）などのために用い（もちい）られる図表（ずひょう）である。","エ．管理（かんり）盤（ばん）は、作業（さぎょう）者（しゃ）別（べつ）又は（または）機械（きかい）別（べつ）の作業（さぎょう）予定（よてい）の指示（しじ）、現品（げんぴん）管理（かんり）及び（および）統制（とうせい）について、作業（さぎょう）伝票（でんぴょう）などを用い（もちい）て行う（おこなう）表示（ひょうじ）盤（ばん）である。"],a:2,e:"ガントチャートは工程や予定の時間的な進捗を示す図表です。工数計画・余力管理にも使われるためウが適切です。",k:"ガントチャート＝工程・時間・進捗"},
{q:"問題22 棚卸（たなおろし）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．棚卸（たなおろし）の目的（もくてき）の１つには、現品（げんぴん）数（すう）と帳簿（ちょうぼ）上（じょう）の数量（すうりょう）との照合（しょうごう）がある。","イ．定期（ていき）棚卸（たなおろし）の実施（じっし）の条件（じょうけん）として、入（にゅう）出庫（しゅっこ）中（ちゅう）に現品（げんぴん）数（すう）と帳簿（ちょうぼ）上（じょう）の数量（すうりょう）に相当（そうとう）数（すう）の差異（さい）が発見（はっけん）されたときがある。","ウ．在庫（ざいこ）把握（はあく）の精度（せいど）の高い（たかい）棚卸（たなおろし）方法（ほうほう）として、常時（じょうじ）棚卸（たなおろし）がある。","エ．棚卸（たなおろし）資産（しさん）の一般（いっぱん）的（てき）な評価（ひょうか）方法（ほうほう）として、先入（せんにゅう）先出（さきで）法（ほう）や移動（いどう）平均（へいきん）法（ほう）がある。"],a:1,e:"定期棚卸は一定期間ごとに実施するもので、提示されたイの「入出庫中の差異発見」が実施条件という説明は不適切です。",k:"棚卸＝実物数量と帳簿数量の照合"},
{q:"問題10 ロット生産（せいさん）に関する（かんする）記述（きじゅつ）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．各（かく）製品（せいひん）の生産（せいさん）順序（じゅんじょ）や生産（せいさん）時間（じかん）が大幅（おおはば）に異なる（ことなる）場合（ばあい）に採用（さいよう）される形態（けいたい）である。","イ．同一（どういつ）の製品（せいひん）を、一定（いってい）期間（きかん）連続（れんぞく）して生産（せいさん）する形態（けいたい）である。","ウ．品種（ひんしゅ）ごとの生産（せいさん）量（りょう）をまとめて、複数（ふくすう）の製品（せいひん）を交互（こうご）に生産（せいさん）する形態（けいたい）である。","エ．個々（ここ）の注文（ちゅうもん）に応じ（おうじ）て、その都度（つど）１回（いっかい）限り（かぎり）の生産（せいさん）を行う（おこなう）形態（けいたい）である。"],a:2,e:"ロット生産は品種ごとに一定数量をまとめ、ロット単位で複数品種を切り替えて生産する方式です。",k:"ロット生産＝一定数量をまとめて生産"},
{q:"問題18 設備（せつび）の劣化（れっか）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．設備（せつび）の性能（せいのう）劣化（れっか）の原因（げんいん）の１つには、管理（かんり）劣化（れっか）が含ま（ふくま）れる。","イ．使用（しよう）劣化（れっか）に対する（たいする）技術（ぎじゅつ）的（てき）対策（たいさく）には、設備（せつび）の耐熱（たいねつ）、耐圧（たいあつ）、耐震（たいしん）、防塵（ぼうじん）などがある。","ウ．設備（せつび）劣化（れっか）による生産（せいさん）量（りょう）の低下（ていか）の原因（げんいん）には、所期（しょき）の性能（せいのう）が発揮（はっき）されないこと、設備（せつび）故障（こしょう）によって生産（せいさん）が休止（きゅうし）することが挙げ（あげ）られる。","エ．設備（せつび）劣化（れっか）に対する（たいする）基本（きほん）的（てき）な防止（ぼうし）策（さく）には、日常（にちじょう）保全（ほぜん）、設備（せつび）検査（けんさ）、保全（ほぜん）計画（けいかく）等（とう）を実施（じっし）して行う（おこなう）ことが重要（じゅうよう）である。"],a:1,e:"提示された内容では、耐熱・耐圧・耐震・防塵などは設備の設計・仕様に関する対策として扱われるため、使用劣化への技術的対策という説明が不適切です。",k:"劣化＝管理劣化・使用劣化; 日常保全"},
{q:"問題15 設備（せつび）管理（かんり）の考え方（かんがえかた）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．現代（げんだい）の設備（せつび）は、自動（じどう）化（か）、高（こう）性能（せいのう）化（か）、高速（こうそく）化（か）が進み（すすみ）、その結果（けっか）、生産（せいさん）性（せい）や収益（しゅうえき）性（せい）が大きく（おおきく）左右（さゆう）されるので、設備（せつび）の合理（ごうり）化（か）は重要（じゅうよう）な課題（かだい）である。","イ．設備（せつび）の保全（ほぜん）部門（ぶもん）の担当（たんとう）者（しゃ）は、設備（せつび）を運転（うんてん）している製造（せいぞう）担当（たんとう）者（しゃ）より、設備（せつび）の微小（びしょう）な異常（いじょう）や不具合（ふぐあい）の前兆（ぜんちょう）などに気付き（きづき）やすいので、保全（ほぜん）担当（たんとう）者（しゃ）による日常（にちじょう）点検（てんけん）が有効（ゆうこう）である。","ウ．設備（せつび）異常（いじょう）の早期（そうき）発見（はっけん）には、自主（じしゅ）保全（ほぜん）基準（きじゅん）を作成（さくせい）し、日常（にちじょう）的（てき）に自主（じしゅ）点検（てんけん）を行う（おこなう）ことが大切（たいせつ）である。","エ．設備（せつび）管理（かんり）の対象（たいしょう）は、設備（せつび）の計画（けいかく）から、それを設計（せっけい）、製作（せいさく）、調達（ちょうたつ）して運用（うんよう）し、保全（ほぜん）を経（へ）て、設備（せつび）の廃却（はいきゃく）や再（さい）利用（りよう）に至る（いたる）までの範囲（はんい）に及ん（およん）でいる。"],a:1,e:"設備を実際に運転している作業者は小さな異常や前兆に気づきやすいので、日常点検は自主保全として運転者が行うのが基本です。",k:"自主保全＝運転者の日常点検"},
{q:"問題1 生産（せいさん）システムに関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．生産（せいさん）システムにおけるデザインインは、調達（ちょうたつ）にかかわる業務（ぎょうむ）プロセスにおいて、量産（りょうさん）以降（いこう）で行わ（おこなわ）れる活動（かつどう）である。","イ．生産（せいさん）システムにおける製品（せいひん）設計（せっけい）の活動（かつどう）から得（え）られる部品（ぶひん）構成（こうせい）表（ひょう）は、生産（せいさん）管理（かんり）における種々（しゅじゅ）の管理（かんり）業務（ぎょうむ）に利用（りよう）される重要（じゅうよう）な情報（じょうほう）である。","ウ．生産（せいさん）システムにおける物流（ぶつりゅう）を調達（ちょうたつ）物流（ぶつりゅう）と販売（はんばい）物流（ぶつりゅう）とに分け（わけ）たとき、調達（ちょうたつ）物流（ぶつりゅう）には外注（がいちゅう）管理（かんり）の管理（かんり）業務（ぎょうむ）が含ま（ふくま）れる。","エ．生産（せいさん）システムには、製品（せいひん）企画（きかく）・設計（せっけい）システム、資材（しざい）・物流（ぶつりゅう）システム及び（および）製造（せいぞう）システムがある。"],a:0,e:"Design-inは量産後ではなく、製品設計・開発などの早い段階から取引先・調達先を巻き込む活動です。",k:"Design-in＝設計初期から調達先を参加"},
{q:"問題25 マテリアルハンドリングの原則（げんそく）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．ユニットロードの原則（げんそく）","イ．身体（しんたい）の使用（しよう）の原則（げんそく）","ウ．スペース活用（かつよう）の原則（げんそく）","エ．パレット化（か）の原則（げんそく）"],a:1,e:"マテリアルハンドリングの原則にはユニットロード、スペース活用、パレット化などがあります。「身体の使用」は原則として不適切です。",k:"MH＝unit load・space・pallet"},
{q:"問題19 保全（ほぜん）効果（こうか）測定（そくてい）に関する（かんする）各種（かくしゅ）の指標（しひょう）の計算（けいさん）方法（ほうほう）として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．故障（こしょう）度数（どすう）率（りつ）とは、故障（こしょう）件数（けんすう）を負荷（ふか）時間（じかん）で割っ（わっ）た百分率（ひゃくぶんりつ）である。","イ．１件（けん）当たり（あたり）保全（ほぜん）時間（じかん）とは、保全（ほぜん）所要（しょよう）時間（じかん）を保全（ほぜん）件（けん）数（すう）で割っ（わっ）たものである。","ウ．稼働（かどう）率（りつ）とは、実働（じつどう）時間（じかん）を負荷（ふか）時間（じかん）で割っ（わっ）た百分率（ひゃくぶんりつ）である。","エ．緊急（きんきゅう）保全（ほぜん）率（りつ）とは、緊急（きんきゅう）保全（ほぜん）件数（けんすう）を予防（よぼう）保全（ほぜん）件数（けんすう）で割っ（わっ）た百分率（ひゃくぶんりつ）である。"],a:3,e:"緊急保全率は一般に保全全体に占める緊急保全の割合などで管理します。予防保全件数だけを分母にする定義は不適切です。",k:"稼働率＝実働時間÷負荷時間×100"},
{q:"問題13 以下（いか）に示す（しめす）＜現品（げんぴん）管理（かんり）＞の記述（きじゅつ）と＜語句（ごく）＞の組合せ（くみあわせ）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．1：D  2：A  3：B  4：C","イ．1：A  2：B  3：C  4：D","ウ．1：D  2：A  3：C  4：B","エ．1：A  2：D  3：B  4：C"],a:0,e:"1は過剰仕掛品の防止(D)、2は計数・保管の容易化(A)、3は棚卸(B)、4は運搬の容易化(C)に対応します。",k:"現品管理＝数量照合・標準容器・運搬容易化"},
{q:"問題28 品質（ひんしつ）改善（かいぜん）の進め方（すすめかた）に関する（かんする）記述（きじゅつ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．品質（ひんしつ）改善（かいぜん）は問題（もんだい）解決（かいけつ）と捉える（とらえる）こともでき、問題（もんだい）解決（かいけつ）は、現実（げんじつ）のレベルを目標（もくひょう）とするレベルに近づける（ちかづける）ことである。","イ．QCストーリーは、効果（こうか）的（てき）に改善（かいぜん）を進めて（すすめて）いくためのステップである。","ウ．品質（ひんしつ）改善（かいぜん）では、問題（もんだい）の真（しん）の原因（げんいん）を解決（かいけつ）することが重要（じゅうよう）であり、原因（げんいん）究明（きゅうめい）手法（しゅほう）としては、チェックシートによる分析（ぶんせき）が最も（もっとも）効果（こうか）的（てき）である。","エ．品質（ひんしつ）改善（かいぜん）において、真（しん）の原因（げんいん）解決（かいけつ）のための対策（たいさく）を実施（じっし）したとしても、歯止め（はどめ）が不充分（ふじゅうぶん）であると、問題（もんだい）が再発（さいはつ）することがある。"],a:2,e:"真の原因を調べる方法は問題によって異なり、チェックシートが常に最も効果的とは限りません。",k:"QCストーリー＝問題解決の手順; 歯止め＝再発防止"},
{q:"物流（ぶつりゅう）コストの管理（かんり）上（じょう）の分類（ぶんるい）とそれに含ま（ふくま）れる費目（ひもく）の組合せ（くみあわせ）として最も（もっとも）不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．変（へん）動（どう）・固定（こてい）別（べつ）分類（ぶんるい）：固定（こてい）物流（ぶつりゅう）費（ひ）","イ．機能（きのう）別（べつ）分類（ぶんるい）：包装（ほうそう）費（ひ）","ウ．主体（しゅたい）別（べつ）分類（ぶんるい）：自家（じか）物流（ぶつりゅう）費（ひ）","エ．領域（りょういき）別（べつ）分類（ぶんるい）：情報（じょうほう）処理（しょり）費（ひ）"],a:3,e:"情報処理費は機能別分類の要素として扱われます。領域別分類とは物流活動の領域などによる分類です。",k:"物流コスト＝変動/固定・機能・主体・領域"},
{q:"問題10 製品（せいひん）の流し方（ながしかた）による分類（ぶんるい）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．製品（せいひん）の流し方（ながしかた）の分類（ぶんるい）には、見込み（みこみ）生産（せいさん）、ロット生産（せいさん）、連続（れんぞく）生産（せいさん）がある。","イ．１つひとつのロットに含ま（ふくま）れる数量（すうりょう）を大きく（おおきく）する場合（ばあい）には、工程（こうてい）間（かん）の仕掛（しかけ）品（ひん）が少なく（すくなく）なるため、生産（せいさん）期間（きかん）が短く（みじかく）なる傾向（けいこう）がある。","ウ．個別（こべつ）生産（せいさん）では、注文（ちゅうもん）ごとに異なる（ことなる）仕様（しよう）、数量（すうりょう）、納期（のうき）をもつ製品（せいひん）の生産（せいさん）について、限ら（かぎら）れた設備（せつび）能力（のうりょく）の下（した）で納期（のうき）を維持（いじ）し、生産（せいさん）設備（せつび）や作業（さぎょう）者（しゃ）の生産（せいさん）効率（こうりつ）を高める（たかめる）ような仕事（しごと）の流し方（ながしかた）を決める（きめる）。","エ．ロット生産（せいさん）とは、品種（ひんしゅ）ごとに生産（せいさん）量（りょう）をまとめて複数（ふくすう）の製品（せいひん）を交互（こうご）に生産（せいさん）する形態（けいたい）のことであり、１つひとつのロットに含ま（ふくま）れる適正（てきせい）な数量（すうりょう）を決める（きめる）ことをロットスケジューリングと呼ぶ（よぶ）。"],a:3,e:"ロット生産では、品種ごとに数量をまとめ、適正なロット数量を決めます。提示文のエが最も適切です。",k:"ロット＝まとめ生産; lot scheduling＝ロット数量・順序の計画"},
{q:"問題26 品質（ひんしつ）管理（かんり）に関する（かんする）記述（きじゅつ）として適切（てきせつ）なものは、次（つぎ）のうちどれか。（TQMはTotal Quality Management、TQCはTotal Quality Control）",
c:["ア．品質（ひんしつ）は、使用（しよう）目的（もくてき）を満たし（みたし）ているかどうかが重要（じゅうよう）であり、生産（せいさん）者（しゃ）が決定（けってい）するものではないとされている。","イ．1980年代（ねんだい）からTQMを基盤（きばん）として経営（けいえい）活動（かつどう）全体（ぜんたい）を扱う（あつかう）TQCが世界（せかい）的（てき）に広がっ（ひろがっ）ている。","ウ．企業（きぎょう）の社会（しゃかい）的（てき）責任（せきにん）として、企業（きぎょう）も経済（けいざい）だけでなく社会（しゃかい）や環境（かんきょう）などの要素（ようそ）にも責任（せきにん）を持つ（もつ）べきであるとされているが、品質（ひんしつ）に関して（かんして）は対象（たいしょう）外（がい）である。","エ．製造（せいぞう）物（ぶつ）責任（せきにん）法（ほう）には…（欠陥（けっかん）により他人（たにん）の生命（せいめい）・身体（しんたい）・財産（ざいさん）を侵害（しんがい）したときの責任（せきにん））…"],a:0,e:"品質は顧客の使用目的を満たすことが重要で、単に生産者が決めるものではありません。",k:"品質＝使用目的を満たす; TQM/TQC; PL法"},
{q:"問題3 IE（Industrial Engineering）手法（しゅほう）を適用（てきよう）して作業（さぎょう）の改善（かいぜん）を行う（おこなう）場合（ばあい）、改善（かいぜん）の目標（もくひょう）や考え方（かんがえかた）に関する（かんする）記述（きじゅつ）として最も（もっとも）適切（てきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．動作（どうさ）分析（ぶんせき）の結果（けっか）から、円滑（えんかつ）な動作（どうさ）が実現（じつげん）できるように、第一（だいいち）類（るい）の動作（どうさ）と第二（だいに）類（るい）の動作（どうさ）とが交互（こうご）になる組合せ（くみあわせ）を検討（けんとう）する。","イ．時間（じかん）研究（けんきゅう）で用いる（もちいる）ストップウォッチにおいて、アナログ式（しき）ではレイティングが必要（ひつよう）となるが、デジタル式（しき）ではこれが不要（ふよう）となることから、デジタル式（しき）を用い（もちい）たほうが、改善（かいぜん）の問題（もんだい）点（てん）を発見（はっけん）しやすい。","ウ．稼働（かどう）分析（ぶんせき）の結果（けっか）だけでは、非（ひ）稼働（かどう）の原因（げんいん）は追求（ついきゅう）できないことから、非（ひ）稼働（かどう）の発生（はっせい）を取り除く（とりのぞく）改善（かいぜん）のためには、時間（じかん）研究（けんきゅう）による詳細（しょうさい）な分析（ぶんせき）が不可欠（ふかけつ）である。","エ．複数（ふくすう）の作業（さぎょう）者（しゃ）による組（くみ）作業（さぎょう）を改善（かいぜん）する場合（ばあい）には、手（て）待ち（まち）時間（じかん）を減らす（へらす）ために、連合（れんごう）作業（さぎょう）分析（ぶんせき）の結果（けっか）から、作業（さぎょう）の並行（へいこう）化（か）を図る（はかる）案（あん）を検討（けんとう）するとよい。"],a:3,e:"複数人の組作業では連合作業分析で待ち時間を把握し、作業の並行化を検討することが改善につながります。",k:"IE＝ムダ削減; 連合作業分析＝複数人の待ち時間"},
{q:"問題39 環境（かんきょう）汚染（おせん）防止（ぼうし）に関する（かんする）記述（きじゅつ）として不適切（ふてきせつ）なものは、次（つぎ）のうちどれか。",
c:["ア．大気（たいき）汚染（おせん）防止（ぼうし）法（ほう）では、移動（いどう）発生（はっせい）源（げん）である自動車（じどうしゃ）の排（はい）ガスに対する（たいする）規制（きせい）がある。","イ．典型（てんけい）7公害（こうがい）には、地盤（じばん）沈下（ちんか）や廃棄（はいき）物（ぶつ）処理（しょり）も含ま（ふくま）れる。","ウ．緊急（きんきゅう）事態（じたい）の対応（たいおう）には、必要（ひつよう）箇所（かしょ）への連絡（れんらく）、応急（おうきゅう）措置（そち）及び（および）再発（さいはつ）防止（ぼうし）がある。","エ．水質（すいしつ）汚濁（おだく）防止（ぼうし）法（ほう）は、工場（こうじょう）や家庭（かてい）からの排水（はいすい）が公共（こうきょう）用（よう）水域（すいいき）又は（または）地下（ちか）水へ流れ（ながれ）る排水（はいすい）を規制（きせい）する。"],a:1,e:"典型7公害は大気汚染・水質汚濁・土壌汚染・騒音・振動・地盤沈下・悪臭です。廃棄物処理は含まれません。",k:"典型7公害＝大気・水質・土壌・騒音・振動・地盤沈下・悪臭"}
];

const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
  const d=document.createElement("div"); d.className="question";
  d.innerHTML=`<div><b>Q${i+1}</b></div><div class="jp">${x.q}</div>
  ${x.c.map((v,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"> ${v}</label>`).join("")}
  <div class="explanation" id="exp${i}"></div>`;
  quiz.appendChild(d);
});

let remaining=EXAM_MINUTES*60, submitted=false;
const timer=document.getElementById("timer");
function tick(){
  if(submitted)return;
  const m=Math.floor(remaining/60),s=remaining%60;
  timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if(remaining<=0){submitExam(true);return;}
  remaining--;
}
setInterval(tick,1000); tick();

function submitExam(auto=false){
 if(submitted)return; submitted=true;
 let score=0,answered=0;
 questions.forEach((x,i)=>{
   const sel=document.querySelector(`input[name="q${i}"]:checked`);
   const box=document.querySelectorAll(".question")[i];
   const exp=document.getElementById(`exp${i}`);
   if(sel){answered++; if(Number(sel.value)===x.a){score++;box.classList.add("correct")}else box.classList.add("wrong");}
   exp.style.display="block";
   exp.innerHTML=`<b>Correct answer:</b> ${x.c[x.a]}<br><b>Paliwanag:</b> ${x.e}<br><b>Keyword:</b> ${x.k}`;
   document.querySelectorAll(`input[name="q${i}"]`).forEach(r=>r.disabled=true);
 });
 const pct=(score/questions.length*100).toFixed(1);
 const result=document.getElementById("result");
 result.style.display="block";
 result.innerHTML=`<h2>Score: ${score} / ${questions.length} (${pct}%)</h2>
 <p>Nasagutan: ${answered} • Hindi nasagutan: ${questions.length-answered}</p>
 ${auto?"<p><b>⏰ Time's up — automatic submit.</b></p>":""}
 <button onclick="location.reload()">Try Again</button>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("submit").onclick=()=>submitExam(false);
</script>
